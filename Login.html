<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Nuka</title>
  <link rel="shortcut icon" type="image/x-icon" href="logo.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body class="">
  <header class="site-header">
    <a class="logo" href="HOME.html"><img src="logo.jpg" alt="Nuka logo"></a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true">&#9776;</label>
    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="HOME.html">Home</a></li>
        <li><a href="About.html">About</a></li>
        <li><a href="Product.html">Product</a></li>
        <li><a href="Contact.html">Contact</a></li>
        <li><a href="ORDER.html">Order</a></li>
        <li><a href="Login.html" aria-current="page">Log in</a></li>
      </ul>
    </nav>
  </header>

  <main class="login-section">
    <form class="login-form" action="#" method="post">
      <label for="uname">Username</label>
      <input type="text" id="uname" name="username" placeholder="Enter username" autocomplete="username" required>
      <label for="psw">Password</label>
      <input type="password" id="psw" name="password" placeholder="Enter password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary">Log in</button>
      <button type="reset" class="btn-cancel">Cancel</button>
      <p class="forgot">Forgot <a href="#">password?</a></p>
    </form>
  </main>

  <footer class="site-footer">&copy; 2024 Nuka</footer>
</body>
</html>
